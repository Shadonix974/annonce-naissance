<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Faire-part</title>
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/vendor/cropper.min.css">
</head>
<body>
  <div id="loginPanel" class="login" hidden>
    <form id="loginForm" action="javascript:void(0)">
      <h1>Administration</h1>
      <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
      <button type="submit">Entrer</button>
      <p id="loginError" class="error" hidden></p>
    </form>
  </div>

  <div id="adminPanel" class="panel" hidden>
    <aside class="sidebar">
      <h1>Admin</h1>
      <nav>
        <button data-tab="tweaks" class="active">Textes</button>
        <button data-tab="photos">Photos</button>
        <button data-tab="gifts">Cadeaux</button>
        <button data-tab="timeline">Chronologie</button>
        <button data-tab="link">Lien privé</button>
        <button data-tab="security">Sécurité</button>
      </nav>
      <button id="logoutBtn">Déconnexion</button>
    </aside>
    <main class="editor">
      <section id="tab-tweaks" class="tab"></section>
      <section id="tab-photos" class="tab" hidden></section>
      <section id="tab-gifts" class="tab" hidden></section>
      <section id="tab-timeline" class="tab" hidden></section>
      <section id="tab-link" class="tab" hidden></section>
      <section id="tab-security" class="tab" hidden></section>
    </main>
    <aside class="preview">
      <iframe id="previewFrame" title="Aperçu"></iframe>
    </aside>
  </div>

  <dialog id="cropModal" class="crop-modal" aria-labelledby="cropTitle">
    <form method="dialog" class="crop-modal-inner">
      <div class="crop-stage">
        <img id="cropImage" alt="">
      </div>
      <div class="crop-controls">
        <div class="crop-title" id="cropTitle">Cadrer la photo</div>
        <div class="ratios" id="cropRatios"></div>
        <label class="alt-field">Alt (description pour a11y, obligatoire)
          <input id="cropAlt" maxlength="300" required>
        </label>
        <div class="queue-hint" id="cropQueueHint"></div>
        <div class="actions">
          <button type="button" class="secondary" id="cropCancel">Annuler</button>
          <button type="button" id="cropConfirm" disabled>Suivant →</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="deleteModal" class="delete-modal" aria-labelledby="deleteTitle">
    <form method="dialog" class="delete-modal-inner">
      <div class="delete-title" id="deleteTitle">Supprimer cette photo ?</div>
      <div class="delete-body">Cette action est définitive.</div>
      <div class="actions">
        <button type="button" class="secondary" id="deleteCancel">Annuler</button>
        <button type="button" class="danger" id="deleteConfirm">Supprimer</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/admin.js"></script>
</body>
</html>
