<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Faire-part de naissance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Italianno&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/print.css">
</head>
<body>
  <main class="sheet">
    <article class="polaroid">
      <div class="tape no-print" aria-hidden="true"></div>

      <div class="photo">
        <img class="cover-photo" id="coverPhoto" alt="" data-hidden>
        <div class="cover-fallback" id="coverFallback">— photo à venir —</div>
      </div>

      <div class="caption">
        <div class="welcome">bienvenue à</div>

        <h1 class="name" data-t="babyName">Léonard</h1>
        <div class="middle-name" data-t="babyMiddle">Augustin</div>

        <div class="divider" aria-hidden="true">· · ·</div>

        <div class="meta">
          <span data-t="dateLong">14 avril 2026</span><span class="dot">·</span><span data-t="timeBirth">04h27</span>
        </div>
        <div class="meta">
          <span data-t="weight">3,42</span>&nbsp;kg<span class="dot">·</span><span data-t="height">51</span>&nbsp;cm
        </div>

        <div class="place">
          <span data-t="city">Paris</span><span class="sep">✦</span><span data-t="maternity">Maternité des Lilas</span>
        </div>

        <div class="parents">
          <span data-t="mother">Camille</span><span class="amp">&amp;</span><span data-t="father">Julien</span>
        </div>
      </div>
    </article>
  </main>

  <script src="/print.js"></script>
</body>
</html>
